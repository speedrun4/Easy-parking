steps:
  # Etapa 1: Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/easy-parking:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/easy-parking:latest'
      - '.'
    waitFor: ['-']

  # Etapa 2: Push para Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/easy-parking:$SHORT_SHA'
    waitFor: ['build-image']

  # Etapa 3: Deploy no Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    id: 'deploy-cloud-run'
    args:
      - 'run'
      - '--filename=deployment/'
      - '--image=gcr.io/$PROJECT_ID/easy-parking:$SHORT_SHA'
      - '--location=us-central1'
      - '--namespace=default'
    waitFor: ['push-image']
    env:
      - 'CLOUDSDK_COMPUTE_REGION=us-central1'
      - 'CLOUDSDK_CONTAINER_CLUSTER=easy-parking-cluster'

# Configurações da build
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  
# Artefatos gerados
images:
  - 'gcr.io/$PROJECT_ID/easy-parking:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/easy-parking:latest'

# Timeout de 30 minutos
timeout: '1800s'

# Tags para organização
tags:
  - 'easy-parking'
  - 'production'
  - '$SHORT_SHA'
  - 'latest'
