steps:
  # Etapa 1: Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/easy-parking:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/easy-parking:latest'
      - '.'
    waitFor: ['-']

  # Etapa 2: Push das imagens
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image-sha'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/easy-parking:$SHORT_SHA'
    waitFor: ['build-image']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image-latest'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/easy-parking:latest'
    waitFor: ['build-image']

  # Etapa 3: Deploy no Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    args:
      - 'gcloud'
      - 'run'
      - 'deploy'
      - 'easy-parking'
      - '--image=gcr.io/$PROJECT_ID/easy-parking:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=3600'
      - '--max-instances=10'
      - '--set-env-vars=SPRING_PROFILES_ACTIVE=prod'
    waitFor: ['push-image-sha', 'push-image-latest']

# Configurações da build
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  
# Artefatos gerados
images:
  - 'gcr.io/$PROJECT_ID/easy-parking:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/easy-parking:latest'

# Timeout de 30 minutos
timeout: '1800s'

# Tags para organização
tags:
  - 'easy-parking'
  - 'production'
  - '$SHORT_SHA'
  - 'latest'
