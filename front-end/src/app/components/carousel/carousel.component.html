<div class="carousel">
  <carousel [interval]="5000" [noPause]="false" [showIndicators]="true">
    <slide>
      <div
        class="slide-content promo-clickable"
        role="button"
        tabindex="0"
        aria-label="Abrir promoção de primeira reserva"
        (click)="goToFirstReservationPromoLogin()"
        (keydown.enter)="goToFirstReservationPromoLogin()"
        (keydown.space)="goToFirstReservationPromoLogin()">
        <div class="slide-image">
          <img src="assets/images/promos/promo-primeira-reserva.svg" alt="Ganhe 10% OFF na primeira reserva" loading="lazy">
        </div>
        <div class="slide-text">
          <h3>Primeira Reserva 10% OFF</h3>
          <p>Oferta valida apenas para novos usuarios no pagamento.</p>
        </div>
      </div>
    </slide>
    <slide>
      <div
        class="slide-content promo-clickable"
        role="button"
        tabindex="0"
        aria-label="Abrir promoção de reserva antecipada"
        (click)="goToAdvancePromoLogin()"
        (keydown.enter)="goToAdvancePromoLogin()"
        (keydown.space)="goToAdvancePromoLogin()">
        <div class="slide-image">
          <img src="assets/images/promos/promo-reserva-antecipada.svg" alt="Economize reservando sua vaga com antecedência" loading="lazy">
        </div>
        <div class="slide-text">
          <h3>Reserva Antecipada 5% OFF</h3>
          <p>Desconto válido para reservas feitas com 24h de antecedência.</p>
        </div>
      </div>
    </slide>
  </carousel>
  
</div>
