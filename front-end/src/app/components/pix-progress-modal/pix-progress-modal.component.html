<h2 mat-dialog-title>Pagamento via PIX</h2>
<div mat-dialog-content>
  <p *ngIf="status==='INICIANDO'">Gerando cobrança PIX...</p>
  <p *ngIf="status==='WAITING'">Aguardando pagamento...</p>
  <p *ngIf="status==='PAID'">Pagamento confirmado!</p>
  <p *ngIf="status==='TIMEOUT'" style="color:#b91c1c">Tempo esgotado. Tente novamente.</p>
  <p *ngIf="status==='ERRO'" style="color:#b91c1c">{{ errorMsg }}</p>

  <div *ngIf="qrBase64" style="margin-top:10px; text-align:center;">
    <img [src]="qrBase64" alt="QR PIX" style="width:220px;height:220px;" />
  </div>

  <div *ngIf="qrPayload" style="margin-top:10px;">
    <p>Copia e Cola:</p>
    <textarea readonly style="width:100%;height:80px;">{{ qrPayload }}</textarea>
  </div>
</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="close()">Fechar</button>
</div>
