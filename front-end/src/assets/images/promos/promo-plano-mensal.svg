    </linearGradient>
    <filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='6' stdDeviation='12' flood-color='rgba(0,0,0,0.25)'/>
    </filter>
  </defs>
  <rect width='1200' height='300' fill='url(#g1)' rx='24'/>
  <!-- pattern dots -->
