    <text x='0' y='44' font-family='Inter, Segoe UI, Arial' font-size='54' font-weight='800' fill='#0EA5E9'>20% OFF</text>
    <text x='0' y='82' font-family='Inter, Segoe UI, Arial' font-size='20' fill='#334155'>Assine hoje e economize no seu dia a dia.</text>
    <rect x='0' y='100' rx='12' ry='12' width='260' height='44' fill='#0EA5E9'/>
    <text x='20' y='129' font-family='Inter, Segoe UI, Arial' font-size='18' font-weight='700' fill='#ffffff'>Use o cupom: EASY20</text>
