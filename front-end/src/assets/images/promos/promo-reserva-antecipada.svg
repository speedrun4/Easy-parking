<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='300' viewBox='0 0 1200 300'>
  <defs>
    <linearGradient id='g4' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#8B5CF6'/>
      <stop offset='100%' stop-color='#6366F1'/>
    </linearGradient>
    <filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='6' stdDeviation='12' flood-color='rgba(0,0,0,0.25)'/>
    </filter>
  </defs>
  <rect width='1200' height='300' fill='url(#g4)' rx='24'/>
  <!-- calendar icon -->
  <g transform='translate(860,60)' fill='none' stroke='#fff' stroke-width='8' opacity='0.95'>
    <rect x='20' y='36' width='200' height='160' rx='16'/>
    <line x1='20' y1='70' x2='220' y2='70'/>
    <line x1='60' y1='20' x2='60' y2='60' stroke-linecap='round'/>
    <line x1='180' y1='20' x2='180' y2='60' stroke-linecap='round'/>
  </g>
  <!-- content card -->
  <g filter='url(#shadow)'>
    <rect x='60' y='50' width='660' height='200' rx='20' fill='rgba(255,255,255,0.92)'/>
  </g>
  <g transform='translate(90,90)'>
    <text x='0' y='0' font-family='Inter, Segoe UI, Arial' font-size='28' font-weight='700' fill='#1e1b4b'>Reserve com antecedência</text>
    <text x='0' y='44' font-family='Inter, Segoe UI, Arial' font-size='48' font-weight='800' fill='#3730a3'>Economize até 5%</text>
    <text x='0' y='82' font-family='Inter, Segoe UI, Arial' font-size='20' fill='#312e81'>Garanta sua vaga e pague menos.</text>
    <rect x='0' y='100' rx='12' ry='12' width='310' height='44' fill='#7C3AED'/>
    <text x='20' y='129' font-family='Inter, Segoe UI, Arial' font-size='18' font-weight='700' fill='#ffffff'>Ative as notificações de preço</text>
  </g>
</svg>