# Blueprint do Render para o backend do Easy Parking
# Ao conectar este repositório no Render (New > Blueprint), ele cria o serviço
# automaticamente usando esta configuração.
#
# Banco de dados: Postgres externo (ex: Supabase ou Neon, planos free). O plano free do
# Render não suporta disco persistente para web services, então H2 em arquivo local NÃO
# é confiável (dados são apagados quando o serviço "dorme" por inatividade ou recebe um
# novo deploy). Configure as variáveis DATABASE_URL, DATABASE_USERNAME e DATABASE_PASSWORD
# no painel do Render (Environment) apontando para o banco Postgres externo.

services:
  - type: web
    name: easy-parking-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./back-end/Dockerfile.render
    dockerContext: ./back-end
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: APP_MAIL_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: "http://localhost,capacitor://localhost,ionic://localhost"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: PIX_KEY
        sync: false
