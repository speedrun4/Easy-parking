version: '3.8'

services:
  # Banco de dados MySQL
  mysql:
    image: mysql:8.0
    container_name: easy-parking-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: easyparking
      MYSQL_USER: parking
      MYSQL_PASSWORD: parking123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
    networks:
      - easy-parking-network

  # Aplicação Easy Parking
  easy-parking:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easy-parking-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_IP: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: parking
      MYSQL_PASSWORD: parking123
      MYSQL_DB: easyparking
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      PAGBANK_EMAIL: ${PAGBANK_EMAIL}
      PAGBANK_TOKEN: ${PAGBANK_TOKEN}
      PAGBANK_NOTIFICATION_URL: http://localhost:8080/api/pagbank/notifications
      PIX_KEY: ${PIX_KEY}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      timeout: 10s
      retries: 3
      interval: 30s
      start_period: 60s
    volumes:
      - ./logs:/var/log/app
    networks:
      - easy-parking-network
    restart: unless-stopped

volumes:
  mysql-data:
    driver: local

networks:
  easy-parking-network:
    driver: bridge
