spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Asaas (preferencial para PIX)
asaas.api-key=${ASAAS_API_KEY:}
asaas.base-url=${ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
asaas.notification-url=${ASAAS_NOTIFICATION_URL:http://localhost:8080/api/asaas/notifications}
asaas.card.default-remote-ip=${ASAAS_CARD_DEFAULT_REMOTE_IP:127.0.0.1}
asaas.card.default-postal-code=${ASAAS_CARD_DEFAULT_POSTAL_CODE:00000000}
asaas.card.default-address=${ASAAS_CARD_DEFAULT_ADDRESS:Rua Teste Sandbox}
asaas.card.default-address-number=${ASAAS_CARD_DEFAULT_ADDRESS_NUMBER:0}
asaas.card.default-phone=${ASAAS_CARD_DEFAULT_PHONE:11999999999}
asaas.card.default-email=${ASAAS_CARD_DEFAULT_EMAIL:sandbox@easyparking.local}

pix.key=${PIX_KEY:}

# Configuracao SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.main.allow-circular-references=true
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost,capacitor://localhost,ionic://localhost}
