spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# PagBank (PagSeguro)
pagbank.sandbox=${PAGBANK_SANDBOX:false}
pagbank.email=${PAGBANK_EMAIL:}
pagbank.token=${PAGBANK_TOKEN:}
pagbank.client_id=${PAGBANK_CLIENT_ID:}
pagbank.client_secret=${PAGBANK_CLIENT_SECRET:}
pagbank.notification_url=${PAGBANK_NOTIFICATION_URL:http://localhost:8080/api/pagbank/notifications}

# Mercado Pago (preferencial para PIX)
mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
mercadopago.notification-url=${MERCADO_PAGO_NOTIFICATION_URL:http://localhost:8080/api/mercadopago/notifications}
mercadopago.payer-email=${MERCADO_PAGO_PAYER_EMAIL:pagamentos@easyparking.local}

pix.key=${PIX_KEY:}

# Configuracao SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.main.allow-circular-references=true
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost,capacitor://localhost,ionic://localhost}

