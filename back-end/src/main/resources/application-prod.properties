# Spring Boot Production Configuration
# Perfil: prod

spring.profiles.active=prod

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
server.port=8080
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024
server.forward-headers-strategy=framework

# ============================================================================
# DATABASE CONFIGURATION
# ============================================================================
spring.datasource.url=jdbc:mysql://${MYSQL_IP:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:easyparking}
spring.datasource.username=${MYSQL_USER:parking}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================================================
# EMAIL CONFIGURATION
# ============================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.enabled=true

# ============================================================================
# PAGBANK (PAYSEGURO) CONFIGURATION
# ============================================================================
pagbank.sandbox=false
pagbank.email=${PAGBANK_EMAIL:}
pagbank.token=${PAGBANK_TOKEN:}
pagbank.client_id=${PAGBANK_CLIENT_ID:}
pagbank.client_secret=${PAGBANK_CLIENT_SECRET:}
pagbank.notification_url=${PAGBANK_NOTIFICATION_URL:https://easyparkingbr.duckdns.org/api/pagbank/notifications}
pix.key=${PIX_KEY:}

# ============================================================================
# CORS CONFIGURATION
# ============================================================================
app.cors.allowed-origins=${CORS_ORIGINS:https://easy-parking.com,https://www.easy-parking.com,https://easyparkingbr.duckdns.org,http://localhost,capacitor://localhost,ionic://localhost}

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=INFO
logging.file.name=/var/log/app/easy-parking.log
logging.file.max-size=10MB
logging.file.max-history=10
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================================================
# APPLICATION CONFIGURATION
# ============================================================================
spring.main.allow-circular-references=true
spring.application.name=easy-parking
spring.application.version=1.0.0

# ============================================================================
# JACKSON CONFIGURATION (JSON)
# ============================================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

# ============================================================================
# PERFORMANCE TUNING
# ============================================================================
spring.devtools.restart.enabled=false
server.http2.enabled=true
