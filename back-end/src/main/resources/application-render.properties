# Configuração para deploy gratuito no Render
# Perfil: render (ativado via SPRING_PROFILES_ACTIVE no Dockerfile/variável de ambiente)
# Usa banco H2 em arquivo (dados são perdidos a cada novo deploy/reinício do serviço).

# ============================================================================
# SERVER CONFIGURATION
# Render injeta a variável PORT; o app precisa escutar nela.
# ============================================================================
server.port=${PORT:8080}
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024
server.forward-headers-strategy=framework

# ============================================================================
# DATABASE CONFIGURATION (H2 embutido)
# ============================================================================
spring.datasource.url=jdbc:h2:file:./data/easy-parking-render;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;AUTO_SERVER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.h2.console.enabled=false

# ============================================================================
# EMAIL CONFIGURATION (opcional; deixe em branco para desabilitar envio real)
# ============================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.enabled=${APP_MAIL_ENABLED:false}

# ============================================================================
# PAGAMENTOS (preencha as chaves reais nas variáveis de ambiente do Render)
# ============================================================================
asaas.api-key=${ASAAS_API_KEY:}
asaas.base-url=${ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
asaas.notification-url=${ASAAS_NOTIFICATION_URL:}
asaas.card.default-remote-ip=${ASAAS_CARD_DEFAULT_REMOTE_IP:127.0.0.1}
asaas.card.default-postal-code=${ASAAS_CARD_DEFAULT_POSTAL_CODE:00000000}
asaas.card.default-address=${ASAAS_CARD_DEFAULT_ADDRESS:Rua Teste Sandbox}
asaas.card.default-address-number=${ASAAS_CARD_DEFAULT_ADDRESS_NUMBER:0}
asaas.card.default-phone=${ASAAS_CARD_DEFAULT_PHONE:11999999999}
asaas.card.default-email=${ASAAS_CARD_DEFAULT_EMAIL:sandbox@easyparking.local}

pagbank.sandbox=${PAGBANK_SANDBOX:true}
pagbank.email=${PAGBANK_EMAIL:}
pagbank.token=${PAGBANK_TOKEN:}
pagbank.client_id=${PAGBANK_CLIENT_ID:}
pagbank.client_secret=${PAGBANK_CLIENT_SECRET:}
pagbank.notification_url=${PAGBANK_NOTIFICATION_URL:}

mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
mercadopago.notification-url=${MERCADO_PAGO_NOTIFICATION_URL:}
mercadopago.payer-email=${MERCADO_PAGO_PAYER_EMAIL:pagamentos@easyparking.local}

pix.key=${PIX_KEY:}

# ============================================================================
# CORS CONFIGURATION
# Inclua aqui a origem do seu app/site. capacitor://localhost cobre o APK Android.
# ============================================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost,capacitor://localhost,ionic://localhost}

# ============================================================================
# APPLICATION CONFIGURATION
# ============================================================================
spring.main.allow-circular-references=true
spring.application.name=easy-parking
logging.level.root=INFO
